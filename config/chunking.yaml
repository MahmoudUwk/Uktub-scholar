# uktub-scholar chunking + claim verification (every limit names its source)
chunking:
  chunk_tokens: 1024      # measured window (recall plateaus here; docs/benchmarks window sweep, 2026-10-04)
  overlap_tokens: 16      # carried into the next chunk (continuity, not context)
  chars_per_token: 2.8    # calibrated on this corpus with the mmBERT tokenizer (median 4.1, densest paper 3.10; 0.9 headroom so strict_encoding never raises)
  boundary: paragraph     # paragraph | hard
verification:
  engine: eos             # ClaimEngine registry in src/core/verify/engines.ts (eos | openrouter | llama-cpp | k2 | bev | lumma | julia | laya)
  min_confidence: 0.99    # client policy: scientific-writing confidence bar
  workers: 4              # concurrent chunk-verification lanes
  max_judgments: 120      # client policy: fresh judgments per call (≈ 7 min on a 20-requests/minute hosted tier)
